<!DOCTYPE html>
<html>

<head>

  <title>Modern Mobile App</title>

  <!-- jQuery Mobile -->
  <link rel="stylesheet"
  href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">

  <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>

  <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>

  <!-- Icons -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>

    body{
      font-family:Arial;
    }

    .top{
      text-align:center;
      padding:30px 10px;
      background:linear-gradient(135deg,#667eea,#764ba2);
      color:white;
      border-radius:0 0 25px 25px;
    }

    .top i{
      font-size:60px;
      margin-bottom:10px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:15px;
      margin-top:20px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    .menu a{
      text-decoration:none;
      color:black;
    }

    .menu .ui-btn{
      border-radius:12px;
      margin-top:10px;
    }

  </style>

</head>

<body>

<!-- HOME PAGE -->

<div data-role="page" id="home">

  <!-- HEADER -->

  <div class="top">

    <i class="fa-solid fa-mobile-screen"></i>

    <h1>Mobile Dashboard</h1>

    <p>jQuery Mobile Application</p>

  </div>

  <!-- CONTENT -->

  <div role="main" class="ui-content">

    <!-- Profile Card -->

    <div class="card">

      <h3>Hello, Shrushti 👋</h3>

      <p>Welcome back to your mobile app.</p>

    </div>

    <!-- Menu -->

    <div class="card menu">

      <a href="#" class="ui-btn ui-btn-b">
        <i class="fa-solid fa-house"></i>
        Home
      </a>

      <a href="#" class="ui-btn ui-btn-b">
        <i class="fa-solid fa-user"></i>
        Profile
      </a>

      <a href="#" class="ui-btn ui-btn-b">
        <i class="fa-solid fa-gear"></i>
        Settings
      </a>

      <a href="#about" class="ui-btn ui-btn-b">
        <i class="fa-solid fa-circle-info"></i>
        About
      </a>

    </div>

  </div>

</div>

<!-- ABOUT PAGE -->

<div data-role="page" id="about">

  <div data-role="header" data-theme="b">

    <h1>About</h1>

  </div>

  <div role="main" class="ui-content">

    <div class="card">

      <h2>About App</h2>

      <p>
        Responsive mobile website created using
        jQuery Mobile framework.
      </p>

      <a href="#home"
      class="ui-btn ui-btn-b ui-corner-all">

        Back

      </a>

    </div>

  </div>

</div>

</body>
</html>
