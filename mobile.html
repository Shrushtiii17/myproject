<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Mobile App</title>
    
    <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css" />
    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
    <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
</head>
<body>

    <div data-role="page" id="home">
        <div data-role="header"><h1>Home</h1></div>
        <div data-role="content">
            <p>Welcome to my mobile app</p>
            <a href="#about" data-role="button">About</a>
            <a href="#contact" data-role="button">Contact</a>
        </div>
        <div data-role="footer"><h4>My App</h4></div>
    </div>

    <div data-role="page" id="about">
        <div data-role="header">
            <a href="#home" data-icon="back">Back</a>
            <h1>About</h1>
        </div>
        <div data-role="content">
            <p>This is a mobile website using jquery</p>
        </div>
        <div data-role="footer"><h4>My App</h4></div>
    </div>

    <div data-role="page" id="contact">
        <div data-role="header">
            <a href="#home" data-icon="back">Back</a>
            <h1>Contact</h1>
        </div>
        <div data-role="content">
            <label>Name </label>
            <input type="text" id="uname" placeholder="Your name" />
            <label>Email</label>
            <input type="text" id="uemail" placeholder="Your email" />
            <a href="#" data-role="button" id="sendBtn">Send</a>
        </div>
        <div data-role="footer"><h4>My App</h4></div>
    </div>
    
</body>

<script>
$(document).ready(function(){

    alert("Welcome to jquery Mobile app");

    $('#sendBtn').click(function(){
        var name = $('#uname').val();
        var email = $('#uemail').val();

        if(name == "" || email == ""){
            alert("please fill all fields")
        }else{
            alert("Message sent");
        }
    })
})
</script>
</html>
